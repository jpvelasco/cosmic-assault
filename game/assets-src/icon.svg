<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The app icon: the Glossy ship (src/render/sprites.ts, SHIP_HULL in hull units) on the Drift sky
    (src/render/palette.ts). scripts/render-icons.mjs rasterizes it to every size in public/icons/: it squares
    the corners of #backdrop for full-bleed variants and scales #mark to fit each variant's safe zone.
  -->
  <defs>
    <clipPath id="frame"><rect id="backdrop" width="512" height="512" rx="104"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d0b44"/><stop offset=".55" stop-color="#0c1a4a"/><stop offset="1" stop-color="#05303d"/>
    </linearGradient>
    <radialGradient id="neb-pink"><stop offset="0" stop-color="#ff4f9a"/><stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb-teal"><stop offset="0" stop-color="#18d6c4"/><stop offset="1" stop-color="#18d6c4" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb-violet"><stop offset="0" stop-color="#7b5cff"/><stop offset="1" stop-color="#7b5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-green"><stop offset="0" stop-color="#39ff14"/><stop offset="1" stop-color="#39ff14" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-gold"><stop offset="0" stop-color="#ffd36b"/><stop offset="1" stop-color="#ffd36b" stop-opacity="0"/></radialGradient>
    <linearGradient id="hull" x1="0" y1="9" x2="0" y2="-9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d6b18"/><stop offset=".5" stop-color="#39ff14"/><stop offset="1" stop-color="#d9ffd0"/>
    </linearGradient>
    <linearGradient id="wing-shade" x1="14" y1="0" x2="-10" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset=".55" stop-color="#0d6b18" stop-opacity="0"/><stop offset="1" stop-color="#0d6b18" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#ffe15a"/><stop offset="1" stop-color="#ff5a28" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cockpit" cx=".38" cy=".3" r=".75">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#9ff4ff"/><stop offset="1" stop-color="#2aa9d6"/>
    </radialGradient>
    <radialGradient id="vignette" cx="256" cy="256" r="362" gradientUnits="userSpaceOnUse">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
    <clipPath id="hull-clip"><polygon points="14,0 -10,-9 -6,0 -10,9"/></clipPath>
    <filter id="flame-blur" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation=".45"/></filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="96" cy="112" r="300" fill="url(#neb-pink)" opacity=".42"/>
    <circle cx="440" cy="420" r="300" fill="url(#neb-teal)" opacity=".38"/>
    <circle cx="300" cy="250" r="220" fill="url(#neb-violet)" opacity=".3"/>
    <g fill="#fff4ff">
      <circle cx="92" cy="300" r="3" opacity=".7"/>
      <circle cx="404" cy="96" r="3.5" opacity=".85"/>
      <circle cx="150" cy="430" r="2.5" opacity=".55"/>
      <circle cx="430" cy="300" r="2.5" opacity=".6"/>
      <circle cx="210" cy="70" r="2" opacity=".5"/>
    </g>
    <rect width="512" height="512" fill="url(#vignette)"/>
    <g id="mark">
      <circle cx="256" cy="256" r="190" fill="url(#glow-green)" opacity=".45"/>
      <g id="ship" transform="translate(256 256) rotate(-35) scale(13.5) translate(1.5 0)">
        <circle cx="-11" cy="0" r="8" fill="url(#glow-gold)" opacity=".5"/>
        <g filter="url(#flame-blur)">
          <polygon class="extent" points="-6.5,-4.6 -17.5,0 -6.5,4.6" fill="url(#flame)"/>
          <polygon points="-6.5,-2 -13,0 -6.5,2" fill="url(#flame)" opacity=".9"/>
        </g>
        <polygon class="extent" points="14,0 -10,-9 -6,0 -10,9" fill="url(#hull)"/>
        <rect x="-10" y="-9" width="24" height="18" fill="url(#wing-shade)" clip-path="url(#hull-clip)"/>
        <polygon points="14,0 -10,-9 -6,0 -10,9" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width=".6" stroke-linejoin="round"/>
        <polyline points="12.4,-1.1 -7.6,-7.4" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width=".5" stroke-linecap="round"/>
        <ellipse cx="2" cy="0" rx="3.5" ry="2" fill="url(#cockpit)" stroke="#e8fdff" stroke-opacity=".8" stroke-width=".35"/>
      </g>
    </g>
  </g>
</svg>
