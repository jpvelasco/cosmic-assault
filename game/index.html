<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cosmic Assault</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#1d0b44" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cosmic Assault" />
    <style>
      /* The Drift palette (src/render/palette.ts; tests/unit/indexStyles.test.ts keeps them in step) and the glass look built on it. */
      :root {
        --space: #05060f;
        --ink: #e8ecff;
        --sky-1: #1d0b44;
        --sky-2: #0c1a4a;
        --sky-3: #05303d;
        --nebula-pink: #ff4f9a;
        --nebula-orange: #ff9a3c;
        --nebula-teal: #18d6c4;
        --nebula-violet: #7b5cff;
        /* The Drift palette's ring gold: stars, the boss tile. */
        --ring: #ffd36b;
        --accent-1: #22d3ff;
        --accent-2: #a855f7;
        --accent-3: #ff4fd8;
        --font-rounded: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --accent-gradient: linear-gradient(90deg, var(--accent-1), var(--accent-2) 55%, var(--accent-3));
        /* The canvas HUD pills' fill and stroke, over a dark tint that keeps text legible on bright sky. */
        --glass-fill: linear-gradient(rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.09));
        --glass-stroke: rgba(255, 255, 255, 0.18);
        --glass-tint: color-mix(in srgb, var(--sky-1) 55%, transparent);
        --glass-tint-lite: color-mix(in srgb, var(--sky-1) 92%, transparent);
        --glass-sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0) 45%);
        --glass-edge: inset 0 1px 0 rgba(255, 255, 255, 0.26), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        --glass: var(--glass-sheen), var(--glass-fill), var(--glass-tint);
        --glass-blur: blur(10px) saturate(1.3);
        --gloss: linear-gradient(180deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.12) 44%, rgba(255, 255, 255, 0) 50%);
        --glow: 0 0 28px color-mix(in srgb, var(--accent-2) 45%, transparent);
        --glow-small: 0 0 14px color-mix(in srgb, var(--accent-2) 40%, transparent);
        --gloss-edge: inset 0 1px 0 rgba(255, 255, 255, 0.5);
        --drop: 0 6px 16px rgba(0, 0, 0, 0.35);
        --text-drop: 0 1px 2px color-mix(in srgb, var(--sky-1) 70%, transparent);
        --pop: cubic-bezier(0.2, 1.4, 0.4, 1);
        /* The one stacking scale over the canvas, lowest first (tests/unit/indexStyles.test.ts keeps every z-index on it). */
        --layer-card: 1;
        --layer-touch: 2;
        --layer-rotate: 3;
        --layer-crash: 4;
        --layer-toast: 5;
      }
      /*
       * Low quality levels (src/render/quality.ts) drop the backdrop blur for a more opaque fill. `--glass` is
       * redeclared whole: its var()s resolve where it is declared, so overriding only the tint here would not reach it.
       */
      body.lite {
        --glass: var(--glass-sheen), var(--glass-fill), var(--glass-tint-lite);
        --glass-blur: none;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: var(--space);
        color: var(--ink);
        font-family: var(--font-rounded);
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
      }
      .overlay {
        position: absolute;
        z-index: var(--layer-card);
        inset: 0;
        box-sizing: border-box;
        display: grid;
        place-content: center;
        justify-items: center;
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        text-align: center;
      }
      .overlay[hidden] {
        display: none;
      }
      /* The title and the menu cards have no run behind them, so they paint the Drift sky themselves. */
      .overlay--title,
      .overlay--menu {
        background:
          radial-gradient(circle 73vh at 18% 25%, color-mix(in srgb, var(--nebula-pink) 30%, transparent), transparent),
          radial-gradient(circle 53vh at 35% 10%, color-mix(in srgb, var(--nebula-orange) 20%, transparent), transparent),
          radial-gradient(circle 77vh at 85% 80%, color-mix(in srgb, var(--nebula-teal) 28%, transparent), transparent),
          radial-gradient(circle 53vh at 60% 55%, color-mix(in srgb, var(--nebula-violet) 22%, transparent), transparent),
          linear-gradient(to bottom right, var(--sky-1), var(--sky-2) 55%, var(--sky-3));
      }
      /* A sparse starfield: small tiles of different sizes, so the repeat never lines up. */
      .overlay--title::before,
      .overlay--menu::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(1.6px 1.6px at 41px 67px, rgba(255, 255, 255, 0.85), transparent),
          radial-gradient(1px 1px at 233px 191px, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(1.2px 1.2px at 347px 29px, rgba(255, 255, 255, 0.65), transparent),
          radial-gradient(1px 1px at 113px 301px, rgba(255, 255, 255, 0.55), transparent),
          radial-gradient(2px 2px at 389px 127px, rgba(255, 255, 255, 0.9), transparent),
          radial-gradient(1.2px 1.2px at 503px 419px, rgba(255, 255, 255, 0.6), transparent),
          radial-gradient(1px 1px at 257px 557px, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(1.4px 1.4px at 601px 251px, rgba(255, 255, 255, 0.75), transparent),
          radial-gradient(1px 1px at 19px 433px, rgba(255, 255, 255, 0.45), transparent);
        background-size:
          409px 347px,
          409px 347px,
          409px 347px,
          541px 463px,
          541px 463px,
          541px 463px,
          683px 601px,
          683px 601px,
          683px 601px;
      }
      /* The attract demo plays on the canvas behind the title: the title's own sky gives way to it, and its card dims a little. */
      .overlay--title.title--attract {
        background: none;
      }
      .overlay--title.title--attract::before {
        display: none;
      }
      .title--attract .card {
        opacity: 0.85;
      }
      /* On the card's top edge, out of its flow, so showing or hiding it never moves the logo or a button under a finger. */
      .demo-label {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 2px 10px;
        border: 1px solid var(--glass-stroke);
        border-radius: 999px;
        background: var(--glass);
      }
      .overlay--pause {
        background: color-mix(in srgb, var(--space) 45%, transparent);
      }
      .overlay--game-over {
        background: color-mix(in srgb, var(--space) 25%, transparent);
      }
      /* Above the touch layer, whatever else is showing: a phone held upright cannot play, so nothing behind is usable. */
      .overlay--rotate {
        z-index: var(--layer-rotate);
        background: color-mix(in srgb, var(--space) 88%, transparent);
      }
      /* The recovery card sits over whatever screen crashed, so it hides that one almost fully. */
      .overlay--crash {
        z-index: var(--layer-crash);
        background: color-mix(in srgb, var(--space) 93%, transparent);
      }
      .overlay p,
      .overlay h1,
      .overlay h2 {
        margin: 0;
      }
      .card {
        position: relative;
        display: grid;
        justify-items: center;
        gap: clamp(8px, 2vmin, 14px);
        padding: clamp(14px, 3.5vmin, 28px) clamp(14px, 4vw, 36px);
        border: 1px solid var(--glass-stroke);
        border-radius: 22px;
        background: var(--glass);
        box-shadow: var(--glass-edge), var(--glow), 0 20px 50px rgba(0, 0, 0, 0.45);
        -webkit-backdrop-filter: var(--glass-blur);
        backdrop-filter: var(--glass-blur);
        animation: pop-in 360ms var(--pop) both;
      }
      @keyframes pop-in {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
      }
      /* The logotype, as on the banner: accent gradient, a gloss over its top half, a thin light edge and a glow. */
      .title {
        font-size: clamp(2rem, 9vmin, 4.25rem);
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: transparent;
        background: var(--gloss), var(--accent-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.35);
        filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent-2) 70%, transparent))
          drop-shadow(0 3px 0 color-mix(in srgb, var(--space) 60%, transparent));
      }
      .heading {
        font-size: clamp(1.5rem, 6vmin, 2.25rem);
        font-weight: 900;
        letter-spacing: 0.02em;
      }
      .label {
        font-weight: 700;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.85;
      }
      .hint {
        opacity: 0.8;
      }
      .score {
        font-size: clamp(1.4rem, 5vmin, 2rem);
        font-weight: 900;
        font-variant-numeric: tabular-nums;
      }
      /* Read by screen readers, never drawn: the boss announcer (src/ui/bossAnnouncer.ts). */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* A card's parts set their own display, which would otherwise override [hidden]. */
      .card [hidden] {
        display: none;
      }
      .build {
        font-size: 0.75rem;
        opacity: 0.5;
      }
      /* The copy-by-hand fallback, shown when the clipboard is unavailable. */
      .crash-report {
        box-sizing: border-box;
        width: min(80vw, 420px);
        height: 8em;
        padding: 8px 10px;
        resize: none;
        user-select: text;
        -webkit-user-select: text;
        font: 0.7rem/1.35 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: inherit;
        border: 1px solid var(--glass-stroke);
        border-radius: 12px;
        background: color-mix(in srgb, var(--space) 70%, transparent);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        align-items: center;
      }
      .overlay button,
      .overlay .segment {
        font: inherit;
        font-weight: 800;
        color: inherit;
        border: 1px solid var(--glass-stroke);
        border-radius: 999px;
        background: var(--glass);
        box-shadow: var(--glass-edge);
        cursor: pointer;
        transition:
          transform 160ms var(--pop),
          filter 160ms ease;
      }
      /* `nav-keys` is set while a pad or arrow key drives focus, which browsers do not treat as keyboard focus after a click. */
      .overlay button:focus-visible,
      .overlay .segment:has(input:focus-visible),
      body.nav-keys .overlay button:focus,
      body.nav-keys .overlay .segment:has(input:focus) {
        outline: 2px solid var(--accent-3);
        outline-offset: 3px;
      }
      @media (hover: hover) {
        .overlay button:hover,
        .overlay .segment:hover {
          filter: brightness(1.18);
        }
      }
      .overlay button:active,
      .overlay .segment:active {
        transform: scale(0.95);
      }
      /* Primary actions and the chosen setting wear the accent gradient. */
      .overlay .menu-button--primary,
      .overlay .segment:has(input:checked) {
        color: white;
        text-shadow: var(--text-drop);
        border-color: rgba(255, 255, 255, 0.45);
        background: var(--gloss), var(--accent-gradient);
        box-shadow:
          var(--gloss-edge),
          0 0 18px color-mix(in srgb, var(--accent-2) 55%, transparent),
          var(--drop);
      }
      .menu-button {
        min-width: 168px;
        padding: 10px 24px;
      }
      /*
       * The key that does a button's action, worn in the right padding the button keeps whether a key shows or not, so
       * the input kind never moves or resizes it (`wearKey` in src/ui/dom.ts).
       */
      .menu-button.wears-key {
        position: relative;
        padding-inline: 58px;
      }
      .key-hint {
        position: absolute;
        top: 50%;
        right: 12px;
        transform: translateY(-50%);
        padding: 0 5px;
        border: 1px solid currentColor;
        border-radius: 6px;
        font-size: 0.7em;
        line-height: 1.5;
        opacity: 0.8;
      }
      /* A line as large as every wording it may take, the others stacked under it unseen (`reserveSpace` in src/ui/dom.ts). */
      .reserve {
        display: grid;
      }
      .reserve > * {
        grid-area: 1 / 1;
      }
      .reserve__copy {
        visibility: hidden;
      }
      .reserve__copy::before {
        content: attr(data-text);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 16px;
        font-size: 0.875rem;
      }
      .chip[hidden] {
        display: none;
      }
      /* A locked Dimension or galaxy: shown, with what opens it, but not pressable. */
      .overlay button:disabled {
        cursor: default;
        opacity: 0.55;
        filter: none;
        transform: none;
      }
      /* The iOS install steps: longer than a chip, and not a control, so a quiet line under the row. */
      .install-hint {
        font-size: 0.75rem;
        opacity: 0.7;
      }
      .sound-toggle {
        padding-left: 12px;
      }
      .sound-toggle::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-1);
        box-shadow: 0 0 8px var(--accent-1);
      }
      .sound-toggle--muted {
        color: color-mix(in srgb, var(--ink) 70%, transparent);
      }
      .sound-toggle--muted::before {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px currentColor;
      }
      /* The settings, records and Hangar cards open over another card, which they all but hide. */
      .overlay--settings,
      .overlay--records,
      .overlay--hangar {
        background: color-mix(in srgb, var(--space) 78%, transparent);
      }
      .overlay--settings .card,
      .overlay--records .card,
      .overlay--hangar .card {
        box-sizing: border-box;
        width: min(calc(100vw - 48px), var(--cover-width, 540px));
        max-height: 100%;
        overflow-y: auto;
      }
      /* The settings card: a list of labelled controls that runs to two columns where the card is wide enough. */
      .overlay--settings .card {
        justify-items: stretch;
      }
      .overlay--settings .heading {
        text-align: center;
      }
      .settings-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
        gap: 12px 28px;
        text-align: left;
      }
      .setting {
        display: grid;
        gap: 6px;
        align-content: start;
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .setting[hidden] {
        display: none;
      }
      .setting__head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .setting input[type='range'] {
        width: 100%;
        min-height: 28px;
        margin: 0;
        accent-color: var(--accent-1);
      }
      .setting--check {
        grid-auto-flow: column;
        justify-content: start;
        align-items: center;
      }
      .setting--check input {
        width: 22px;
        height: 22px;
        margin: 0;
        accent-color: var(--accent-2);
      }
      .segments {
        display: flex;
        gap: 6px;
      }
      /* A radio shown as a glass pill: the input covers it, invisible, so a tap lands on the radio itself. */
      .segment {
        position: relative;
        flex: 1;
        padding: 8px 0;
        text-align: center;
        cursor: pointer;
      }
      .segment input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      /* Over every card, the crash card included: Copy report's only feedback is this toast. */
      .toast {
        position: absolute;
        z-index: var(--layer-toast);
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        padding: 6px 16px;
        border: 1px solid var(--glass-stroke);
        border-radius: 999px;
        background: var(--glass);
        box-shadow: var(--glass-edge), var(--glow-small);
        -webkit-backdrop-filter: var(--glass-blur);
        backdrop-filter: var(--glass-blur);
        font-size: 0.85rem;
        font-weight: 800;
        pointer-events: none;
        opacity: 0;
        transition: opacity 160ms ease;
      }
      .toast--shown {
        opacity: 1;
      }
      /* Touch controls: positions and sizes are inline in src/input/touchControls.ts; this is only their look. */
      .touch-stick,
      .touch-fire,
      .touch-pause {
        border-style: solid;
        box-shadow: var(--glass-edge), var(--glow-small);
        font: 900 16px/1 var(--font-rounded);
      }
      .touch-stick {
        border-color: color-mix(in srgb, var(--accent-1) 55%, transparent);
        background:
          radial-gradient(circle closest-side, transparent 60%, color-mix(in srgb, var(--accent-1) 22%, transparent)),
          var(--glass-fill),
          color-mix(in srgb, var(--sky-1) 30%, transparent);
      }
      .touch-knob {
        background: radial-gradient(circle at 38% 30%, white, var(--accent-1) 45%, var(--accent-2));
        box-shadow:
          inset 0 -3px 6px color-mix(in srgb, var(--sky-1) 45%, transparent),
          0 0 14px color-mix(in srgb, var(--accent-1) 60%, transparent);
      }
      .touch-fire {
        border-color: rgba(255, 255, 255, 0.5);
        background: var(--gloss), linear-gradient(135deg, var(--accent-2), var(--accent-3));
        box-shadow:
          var(--gloss-edge),
          0 0 22px color-mix(in srgb, var(--accent-3) 55%, transparent),
          var(--drop);
        color: white;
        letter-spacing: 0.06em;
        text-shadow: var(--text-drop);
      }
      .touch-pause {
        border-color: var(--glass-stroke);
        background: var(--glass);
        color: var(--ink);
        letter-spacing: -1px;
      }
      /* Each Dimension's accent: two hues for its orb, glows and borders (src/ui/dimensionMap.ts, galaxySelect.ts). */
      [data-dimension='1'] {
        --hue: 190;
        --hue-2: 275;
      }
      [data-dimension='2'] {
        --hue: 160;
        --hue-2: 215;
      }
      [data-dimension='3'] {
        --hue: 350;
        --hue-2: 25;
      }
      [data-dimension='4'] {
        --hue: 265;
        --hue-2: 315;
      }
      [data-dimension='5'] {
        --hue: 45;
        --hue-2: 15;
      }
      /* The Hangar: a still preview of the ship, then a radio group per look kind; a locked choice is dimmed and says its cost. */
      .hangar-preview {
        display: block;
        width: min(220px, 100%);
        height: auto;
        aspect-ratio: 2 / 1;
        margin: 0 auto;
        border-radius: 14px;
        background: color-mix(in srgb, white 5%, transparent);
      }
      .hangar-head {
        display: grid;
        justify-items: center;
        gap: inherit;
      }
      .hangar-stars {
        margin: 0;
      }
      /* Each group spans the card, its pills in one row of equal widths. */
      .overlay--hangar .card {
        --cover-width: 600px;
      }
      .hangar-group {
        display: grid;
        gap: 6px;
        justify-self: stretch;
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .hangar-group__row {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(0, 1fr);
        gap: 6px;
      }
      .overlay .hangar-option {
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 2px;
        padding: 8px 6px;
        font-size: 0.9rem;
        line-height: 1.2;
      }
      .hangar-option__note {
        font-size: 0.7rem;
        font-weight: 700;
        opacity: 0.8;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .hangar-option--locked {
        opacity: 0.5;
        cursor: not-allowed;
      }
      /* The records card: the Rank board, one row per run, its columns lined up across the rows. */
      .records-board {
        display: grid;
        grid-template-columns: auto 1fr auto auto auto;
        gap: 4px;
        width: 100%;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .records-row {
        display: grid;
        grid-column: 1 / -1;
        grid-template-columns: subgrid;
        align-items: baseline;
        column-gap: 12px;
        padding: 4px 12px;
        border-radius: 10px;
        background: color-mix(in srgb, white 6%, transparent);
        font-variant-numeric: tabular-nums;
        text-align: left;
      }
      .records-row__place,
      .records-row__date {
        font-size: 0.8rem;
        opacity: 0.7;
      }
      .records-row__score,
      .records-classic {
        font-weight: 900;
      }
      .records-daily {
        display: grid;
        gap: 2px;
        font-variant-numeric: tabular-nums;
      }
      .records-row__mark {
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.75;
      }
      /* Mode select: Resume Rank (when a run is saved) over three large mode cards: Rank, Free play and the Daily. */
      .resume-slot {
        display: contents;
      }
      .resume-group {
        display: grid;
        justify-items: center;
        gap: 4px;
      }
      .resume-summary {
        font-size: 0.8rem;
        font-weight: 700;
      }
      .mode-cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(10px, 2.4vmin, 18px);
        width: min(780px, calc(100vw - 72px));
      }
      .overlay .mode-card,
      .overlay .dimension-card,
      .overlay .galaxy-tile {
        position: relative;
        display: grid;
        justify-items: center;
        align-content: start;
        gap: 6px;
        border-radius: 20px;
      }
      .overlay .mode-card {
        padding: clamp(14px, 3vmin, 22px) 14px;
      }
      .overlay .mode-card--rank {
        border-color: rgba(255, 255, 255, 0.45);
        box-shadow: var(--glass-edge), 0 0 22px color-mix(in srgb, var(--accent-2) 50%, transparent);
      }
      .mode-card__badge {
        display: grid;
        place-items: center;
        width: clamp(44px, 10vmin, 64px);
        aspect-ratio: 1;
        border-radius: 50%;
        font-size: clamp(1.3rem, 5vmin, 2rem);
        color: white;
        text-shadow: var(--text-drop);
        background: var(--gloss), radial-gradient(circle at 35% 30%, var(--accent-1), var(--accent-2) 60%, var(--sky-1));
        box-shadow: var(--gloss-edge), 0 0 18px color-mix(in srgb, var(--accent-2) 55%, transparent);
      }
      .mode-card--free .mode-card__badge {
        background: var(--gloss), radial-gradient(circle at 35% 30%, var(--nebula-teal), var(--accent-1) 55%, var(--sky-2));
        box-shadow: var(--gloss-edge), 0 0 18px color-mix(in srgb, var(--accent-1) 50%, transparent);
      }
      .mode-card--daily .mode-card__badge {
        background: var(--gloss), radial-gradient(circle at 35% 30%, var(--accent-3), var(--accent-2) 55%, var(--sky-2));
        box-shadow: var(--gloss-edge), 0 0 18px color-mix(in srgb, var(--accent-3) 50%, transparent);
      }
      .mode-card__name {
        font-size: clamp(1.15rem, 4vmin, 1.5rem);
        font-weight: 900;
      }
      .mode-card__text {
        max-width: 22ch;
        font-size: 0.85rem;
        font-weight: 600;
        opacity: 0.8;
      }
      .mode-card__blurb {
        max-width: 24ch;
        font-size: 0.75rem;
        opacity: 0.7;
      }
      .mode-card__streak {
        padding: 1px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 900;
        background: color-mix(in srgb, var(--accent-3) 30%, transparent);
      }
      /* The Dimension map: five planet cards in a row, each tinted by its Dimension. */
      .dimension-row {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: clamp(8px, 1.6vw, 14px);
        width: min(940px, calc(100vw - 72px));
      }
      .overlay .dimension-card,
      .overlay .galaxy-tile {
        border-color: hsl(var(--hue) 90% 72% / 0.42);
        box-shadow: var(--glass-edge), 0 0 18px hsl(var(--hue) 90% 60% / 0.28);
      }
      .overlay .dimension-card {
        gap: 3px;
        padding: 14px 8px 12px;
      }
      .dimension-card__orb {
        position: relative;
        width: clamp(44px, 10vmin, 72px);
        aspect-ratio: 1;
        margin-bottom: 6px;
        border-radius: 50%;
        background:
          var(--gloss),
          radial-gradient(circle at 34% 30%, hsl(var(--hue) 100% 86%), hsl(var(--hue) 90% 58%) 36%, hsl(var(--hue-2) 80% 42%) 70%, hsl(var(--hue-2) 70% 14%));
        box-shadow:
          inset 0 -4px 10px rgba(0, 0, 0, 0.35),
          0 0 22px hsl(var(--hue) 90% 60% / 0.55);
      }
      /* A planet's ring, tilted across the orb. */
      .dimension-card__orb::after {
        content: '';
        position: absolute;
        inset: 40% -24%;
        border: 2px solid hsl(var(--hue) 90% 82% / 0.55);
        border-radius: 50%;
        transform: rotate(-18deg);
      }
      .dimension-card__index {
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        opacity: 0.7;
      }
      .dimension-card__name {
        font-size: 0.95rem;
        font-weight: 900;
        line-height: 1.15;
      }
      .dimension-card__status {
        font-size: 0.8rem;
        font-weight: 700;
        color: hsl(var(--hue) 100% 84%);
      }
      .pips {
        display: flex;
        gap: 4px;
        margin-top: 3px;
      }
      .pip {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
      }
      .pip--lit {
        background: hsl(var(--hue) 100% 72%);
        box-shadow: 0 0 6px hsl(var(--hue) 100% 65%);
      }
      .pip--boss.pip--lit {
        background: var(--ring);
        box-shadow: 0 0 6px var(--ring);
      }
      /* Galaxy select: six tiles, three to a row; the boss tile is gold. */
      .galaxy-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(8px, 1.6vmin, 12px);
        width: min(560px, calc(100vw - 72px));
      }
      .overlay .galaxy-tile {
        align-content: center;
        gap: 4px;
        min-height: clamp(78px, 17vmin, 112px);
        padding: 10px 8px;
        border-radius: 16px;
      }
      .card--galaxies .heading {
        text-shadow: 0 0 18px hsl(var(--hue) 90% 60% / 0.7);
      }
      .galaxy-tile__label {
        font: 900 clamp(1.2rem, 4.2vmin, 1.6rem) / 1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      .galaxy-tile__stars {
        font-size: 1.05rem;
      }
      .galaxy-tile__best {
        font-size: 0.75rem;
        font-weight: 700;
        opacity: 0.8;
      }
      .overlay .galaxy-tile--boss {
        border-color: color-mix(in srgb, var(--ring) 60%, transparent);
        box-shadow: var(--glass-edge), 0 0 18px color-mix(in srgb, var(--ring) 35%, transparent);
      }
      .galaxy-tile--boss .galaxy-tile__label {
        color: var(--ring);
      }
      .galaxy-tile__tag {
        position: absolute;
        top: 6px;
        right: 8px;
        padding: 1px 6px;
        border-radius: 999px;
        font-size: 0.6rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--space);
        background: var(--ring);
      }
      /* Locked: a dim silhouette with a padlock and what opens it. */
      .overlay .is-locked:disabled {
        opacity: 0.85;
        border-color: var(--glass-stroke);
        box-shadow: var(--glass-edge);
      }
      .is-locked .dimension-card__orb {
        background:
          var(--gloss),
          radial-gradient(circle at 34% 30%, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05) 60%, rgba(0, 0, 0, 0.45));
        box-shadow: inset 0 -4px 10px rgba(0, 0, 0, 0.35);
      }
      .is-locked .dimension-card__orb::after {
        border-color: rgba(255, 255, 255, 0.18);
      }
      .is-locked .dimension-card__status,
      .is-locked .galaxy-tile__best {
        max-width: 16ch;
        color: inherit;
        opacity: 0.7;
      }
      .is-locked .galaxy-tile__label,
      .is-locked .dimension-card__index,
      .is-locked .galaxy-tile__tag {
        opacity: 0.45;
      }
      .is-locked .stars {
        display: none;
      }
      /* A padlock in CSS: a body and, above it, its shackle. Shown only on locked items. */
      .lock {
        display: none;
        position: relative;
        width: 14px;
        height: 11px;
        margin-top: 8px;
        border-radius: 3px;
        background: currentColor;
      }
      .lock::before {
        content: '';
        position: absolute;
        bottom: 100%;
        left: 2px;
        right: 2px;
        height: 8px;
        box-sizing: border-box;
        border: 2.5px solid currentColor;
        border-bottom: 0;
        border-radius: 6px 6px 0 0;
      }
      .is-locked .lock {
        display: block;
      }
      .dimension-card__orb .lock {
        position: absolute;
        top: 50%;
        left: 50%;
        margin: 0;
        color: rgba(255, 255, 255, 0.75);
        transform: translate(-50%, -25%);
      }
      /* Stars: gold when won. On the end card they light one after another as it pops in. */
      .stars {
        display: inline-flex;
        gap: 2px;
        font-size: 0.95rem;
        line-height: 1;
        color: rgba(255, 255, 255, 0.22);
      }
      .star--earned {
        color: var(--ring);
        text-shadow: 0 0 8px color-mix(in srgb, var(--ring) 70%, transparent);
      }
      .stars--big {
        gap: 6px;
        font-size: clamp(1.8rem, 7vmin, 2.6rem);
      }
      .stars--big .star--earned {
        display: inline-block;
        animation: star-fill 420ms var(--pop) both;
        animation-delay: calc(200ms + var(--i) * 160ms);
      }
      @keyframes star-fill {
        from {
          opacity: 0;
          transform: scale(0.2) rotate(-50deg);
        }
      }
      /* The end card: what was won, then what comes next. */
      .overlay .card--end {
        min-width: min(340px, calc(100vw - 48px));
        animation-duration: 440ms;
      }
      .badge {
        padding: 3px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: white;
        text-shadow: var(--text-drop);
        background: var(--gloss), var(--accent-gradient);
        box-shadow:
          var(--gloss-edge),
          0 0 16px color-mix(in srgb, var(--accent-3) 55%, transparent);
        animation: pop-in 360ms var(--pop) 700ms both;
      }
      .end-target {
        font-size: 0.9rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .end-lines {
        display: grid;
        gap: 2px;
        width: min(280px, 100%);
      }
      .end-line {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 0.85rem;
        opacity: 0.85;
      }
      .end-line__amount {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .end-line--total {
        margin-top: 4px;
        padding-top: 6px;
        border-top: 1px solid var(--glass-stroke);
        font-size: 1rem;
        font-weight: 800;
        opacity: 1;
      }
      .end-buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 4px;
      }
      /* Narrow screens: the mode cards stack and the map becomes a list of rows. */
      @media (max-width: 640px) {
        .dimension-row {
          grid-template-columns: 1fr;
          width: min(360px, calc(100vw - 48px));
        }
        .overlay .dimension-card {
          grid-template-columns: auto auto 1fr auto;
          align-items: center;
          justify-items: start;
          column-gap: 10px;
          padding: 8px 14px;
        }
        .dimension-card__orb {
          width: 36px;
          margin: 0;
        }
        .pips {
          grid-column: 3;
          margin: 0;
        }
        .is-locked .dimension-card__status {
          max-width: none;
        }
        .card--map {
          max-height: 100%;
          overflow-y: auto;
        }
      }
      @media (max-width: 480px) {
        .mode-cards {
          grid-template-columns: 1fr;
        }
      }
      /* The cursor rests out of the way once a run has gone 2 s without pointer movement (src/app/viewSync.ts). */
      body.cursor-idle,
      body.cursor-idle #app,
      body.cursor-idle #game {
        cursor: none;
      }
      /* Short screens (a phone on its side): the same cards in less height. */
      @media (max-height: 520px) {
        .card {
          gap: 6px;
          padding: 10px 20px;
        }
        .title {
          font-size: clamp(1.5rem, 8vmin, 2.25rem);
        }
        .heading {
          font-size: 1.35rem;
        }
        .menu-button {
          min-width: 140px;
          padding: 6px 20px;
        }
        .chip {
          min-height: 34px;
        }
        .overlay--settings .card,
        .overlay--records .card,
        .overlay--hangar .card {
          width: min(calc(100vw - 32px), var(--cover-width, 540px));
        }
        /* The Hangar on a phone on its side: a smaller preview beside the star count and tighter pills, so the card fits with Back in view. */
        .hangar-head {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
        }
        .hangar-preview {
          width: min(90px, 100%);
          margin: 0;
        }
        .hangar-group {
          gap: 2px;
        }
        .hangar-group__row {
          gap: 4px;
        }
        .overlay .hangar-option {
          gap: 0;
          padding: 4px 6px;
          font-size: 0.85rem;
        }
        .hangar-option__note {
          font-size: 0.6rem;
        }
        .settings-list {
          gap: 6px 24px;
        }
        .setting {
          gap: 2px;
        }
        .setting input[type='range'] {
          min-height: 22px;
        }
        .segment {
          padding: 4px 0;
        }
        .overlay .mode-card {
          gap: 4px;
          padding: 10px 12px;
        }
        .mode-card__badge,
        .dimension-card__orb {
          width: 40px;
        }
        .mode-card__badge {
          font-size: 1.25rem;
        }
        .mode-card__text {
          font-size: 0.75rem;
        }
        .overlay .dimension-card {
          padding: 10px 6px 8px;
        }
        .overlay .galaxy-tile {
          min-height: 62px;
          padding: 6px;
          gap: 2px;
        }
        .galaxy-tile__label {
          font-size: 1.15rem;
        }
        .stars--big {
          font-size: 1.6rem;
        }
        .score {
          font-size: 1.3rem;
        }
        .end-buttons .menu-button {
          min-width: 112px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .card,
        .overlay .card--end,
        .stars--big .star--earned,
        .badge {
          animation: none;
        }
        .overlay button,
        .overlay .segment,
        .toast {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"><canvas id="game" aria-hidden="true"></canvas></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
