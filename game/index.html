<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cosmic Assault</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #05060f;
        color: #e8ecff;
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
      }
      .overlay {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: clamp(8px, 2.5vmin, 16px);
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        text-align: center;
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay--title {
        background: #05060f;
      }
      .overlay--pause {
        background: rgba(5, 6, 15, 0.7);
      }
      .overlay p,
      .overlay h1,
      .overlay h2 {
        margin: 0;
      }
      .title {
        font-size: clamp(2rem, 9vmin, 4rem);
        letter-spacing: 0.02em;
      }
      .heading {
        font-size: clamp(1.5rem, 6vmin, 2.25rem);
      }
      .label {
        font-weight: 600;
      }
      .hint {
        opacity: 0.8;
      }
      .score {
        font-size: 1.25rem;
        font-weight: 600;
      }
      .build {
        font-size: 0.75rem;
        opacity: 0.5;
      }
      .card {
        display: grid;
        justify-items: center;
        gap: 12px;
        padding: 24px 32px;
        border: 1px solid rgba(169, 189, 240, 0.35);
        border-radius: 16px;
        background: #05060f;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
      .overlay button {
        font: inherit;
        font-weight: 600;
        color: inherit;
        background: rgba(169, 189, 240, 0.08);
        border: 2px solid rgba(169, 189, 240, 0.4);
        border-radius: 999px;
        cursor: pointer;
      }
      .overlay button:focus-visible {
        outline: 2px solid #ff4fd8;
        outline-offset: 2px;
      }
      .chip {
        width: 44px;
        height: 44px;
      }
      .chip[aria-pressed='true'] {
        color: #39ff14;
        border-color: #39ff14;
        background: rgba(57, 255, 20, 0.12);
      }
      .menu-button {
        min-width: 160px;
        padding: 10px 24px;
      }
      .toast {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        padding: 6px 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        font-size: 0.85rem;
        font-weight: 800;
        pointer-events: none;
      }
      .toast[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="app"><canvas id="game"></canvas></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
