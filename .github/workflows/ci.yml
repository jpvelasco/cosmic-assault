name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  game:
    name: Game (lint, typecheck, unit, build, e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check workflow guard
        run: npm run check:workflow

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The expert's whole D1–D2 runs: the only pins of D2's late phases, clears and boss kills, so they gate merges
      # here although they live in the balance suite (which the balance job also runs, as a report).
      - name: Expert D1–D2 digests
        run: npm run test:digests

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Check relative asset base
        run: npm run check:base

      - name: Check release build has no test bridge
        run: npm run check:no-bridge

      - name: Check the site layout
        run: npm run check:pages

      - name: Build for end-to-end tests
        run: npm run build:e2e

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: game-playwright-report
          path: game/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload game build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: game-dist
          path: game/dist/
          if-no-files-found: error

  # Frame times under a 4x CPU slowdown, held to the ceilings in game/e2e/perfThresholds.ts. Deploy needs it, so a
  # frame-time regression cannot ship, but it is not a required check: a pull request may merge before it passes.
  perf:
    name: Performance (gates deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright serves both builds and, under CI, does not build them itself.
      - name: Build
        run: npm run build

      - name: Build for end-to-end tests
        run: npm run build:e2e

      - name: Performance
        run: npm run test:perf
        env:
          CI: true

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-perf-report
          path: game/test-results/perf.json
          retention-days: 14
          if-no-files-found: ignore

  # Report only: the bots' many-seed boss kill rates and clear rates (game/tests/balance), one shard a job: each
  # Dimension's d<N>-*.test.ts files, and the Daily's daily*.test.ts. A shard runs every file whose path holds its
  # filter, which check:workflow keeps to one shard a file. They are not required checks and deploy does not need them.
  balance-dimension:
    name: Bot balance, ${{ matrix.label }} (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: d1-, label: Dimension 1 }
          - { shard: d2-, label: Dimension 2 }
          - { shard: d3-, label: Dimension 3 }
          - { shard: d4-, label: Dimension 4 }
          - { shard: d5-, label: Dimension 5 }
          - { shard: daily, label: Daily }
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bot balance
        run: npm run test:balance -- ${{ matrix.shard }}

  # The one balance check the ruleset sees, however many shards there are: it passes only if every shard did.
  balance:
    name: Bot balance (non-blocking)
    needs: [balance-dimension]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.balance-dimension.result }}
        run: test "$SHARDS" = success

  deploy:
    name: Deploy to GitHub Pages
    needs: [game, perf]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download game build
        uses: actions/download-artifact@v8
        with:
          name: game-dist
          path: _site

      - name: Check relative asset base
        run: node game/scripts/check-base.mjs _site

      - name: Check the site has no test bridge
        run: node game/scripts/check-no-bridge.mjs _site

      - name: Check the site layout
        run: node game/scripts/check-pages.mjs _site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
