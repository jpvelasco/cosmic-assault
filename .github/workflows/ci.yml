name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  game:
    name: Game (lint, typecheck, unit, build, e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check workflow guard
        run: npm run check:workflow

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Check relative asset base
        run: npm run check:base

      - name: Check release build has no test bridge
        run: npm run check:no-bridge

      - name: Build for end-to-end tests
        run: npm run build:e2e

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: game-playwright-report
          path: game/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload game build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: game-dist
          path: game/dist/
          if-no-files-found: error

  # Report only: a frame-time reading under a 4x CPU slowdown. It is not a required check and
  # deploy does not need it.
  perf:
    name: Performance report (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright serves both builds and, under CI, does not build them itself.
      - name: Build
        run: npm run build

      - name: Build for end-to-end tests
        run: npm run build:e2e

      - name: Performance report
        run: npm run test:perf
        env:
          CI: true

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-perf-report
          path: game/test-results/perf.json
          retention-days: 14
          if-no-files-found: ignore

  # Report only: the bots' many-seed boss kill rates and clear rates (game/tests/balance). It is
  # not a required check and deploy does not need it.
  balance:
    name: Bot balance (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bot balance
        run: npm run test:balance

  legacy:
    name: Legacy Playwright tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium-desktop --reporter=html,list
        env:
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: [game, legacy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Stage live site
        run: mkdir _site && cp -R website/. _site/

      - name: Add game build at next/
        uses: actions/download-artifact@v8
        with:
          name: game-dist
          path: _site/next

      - name: Verify site root is unchanged website/
        run: diff -r website _site --exclude next

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
