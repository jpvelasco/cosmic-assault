<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
<title id="title">Cosmic Assault</title>
<desc id="desc">A glossy green ship fires magenta shots at shaded rocks across a neon nebula, under the Cosmic Assault logotype.</desc>
